<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Inventario Doméstico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Gestor de Inventario Doméstico</h1>

    <!-- Formulario para agregar producto -->
    <section class="seccion-formulario">
      <h2>Agregar Nuevo Producto</h2>
      <form id="formulario-producto">
        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej. Lámpara de escritorio">
        </div>

        <div class="campo">
          <label for="categoria">Categoría:</label>
          <input type="text" id="categoria" name="categoria" placeholder="Ej. Iluminación">
        </div>

        <div class="campo">
          <label for="cantidad">Cantidad:</label>
          <input type="number" id="cantidad" name="cantidad" placeholder="Ej. 2">
        </div>

        <div class="campo">
          <label for="precio">Precio ($):</label>
          <input type="number" id="precio" name="precio" step="0.01" placeholder="Ej. 18.50">
        </div>

        <button type="submit" id="btn-submit">Agregar Producto</button>
      </form>
      <div id="mensaje-error" class="mensaje-error oculto"></div>
    </section>

    <!-- Controles de filtrado y resumen -->
    <section class="seccion-inventario">
      <div class="barra-filtros">
        <label for="filtro-categoria">Filtrar por categoría:</label>
        <select id="filtro-categoria">
          <option value="todas">Todas</option>
        </select>
      </div>

      <!-- Métricas / Indicadores -->
      <div class="indicadores">
        <div class="indicador">Total productos: <span id="total-productos">0</span></div>
        <div class="indicador">Total unidades: <span id="total-unidades">0</span></div>
        <div class="indicador">Valor total: $<span id="valor-total">0.00</span></div>
        <div class="indicador">Agotados: <span id="total-agotados">0</span></div>
      </div>

      <!-- Tabla de inventario -->
      <table class="tabla-inventario">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-inventario">
          <!-- Celdas insertadas dinámicamente con nodos DOM -->
        </tbody>
      </table>

      <p id="mensaje-vacio" class="mensaje-vacio oculto">No hay productos disponibles para mostrar.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
